# =============================================================================
# Instalaciones que usan este arnés — configuración DEL PRODUCTO.
#
# VERSIONADO y SIN SECRETOS, y además **sin nada de una máquina concreta**: aquí
# solo va lo que sería igual si alguien clonara la misma instalación en otro
# equipo (repo del core, idioma, imagen, red…). Nada de contraseñas, y tampoco
# rutas absolutas.
#
# Mismo espíritu que `Tooling/Scripts/config/*.conf` y la misma forma que
# `fs-mcp/fs-remote-mcp/scripts/despliegues.conf`, de donde está copiada: un
# bloque `[<id>]` por instalación, claves alineadas, y dar de alta una nueva es
# añadir su bloque — no hay que tocar ningún script.
#
# ## EL ÍNDICE ES POR INSTALACIÓN, NO POR MÁQUINA, y esto es lo que decide
#
# Un `Tooling/Scripts/config/*.conf` se indexa por hostname porque describe un
# equipo. Aquí no vale, y el motivo es el propio consumidor: **un worktree es una
# instalación más**. `[mesa-fs]` y `[mesa-fs-wt-buscanarias]` viven en el MISMO
# equipo y necesitan configuraciones distintas —empezando por su base de datos—,
# así que un índice por máquina las metería en el mismo bloque y devolvería el
# problema que este registro viene a quitar: que la copia acabe escribiendo en la
# base de test del original.
#
# El id se deriva de la ruta del proyecto bajo la raíz de repos: `Mesa/FS` →
# `mesa-fs`, `Mesa/FS-wt-rutas` → `mesa-fs-wt-rutas`. Se puede forzar con
# `FS_TEST_ID` para invocaciones no estándar.
#
# ## LAS TRES CLASES DE VALOR, y solo UNA está aquí
#
# Los valores del entorno de pruebas no son todos de la misma naturaleza. Medido
# el 26-ago-2026 sobre los 20 que había, salen tres clases y cada una va a un
# sitio distinto:
#
#   (A) DE LA MÁQUINA y no inferibles — `TESTENV_REPO_PATH`, `TESTENV_DIR`,
#       `FS_TEST_DIR`, `TESTENV_RUN_USER`. Son rutas absolutas de UN equipo.
#       **No van a ningún repo**: viven en `~/.config/tooling/fs-test_maquina.conf`.
#   (B) DERIVABLES de lo que YA está versionado — `TEST_DB` sale de `FS_DB_NAME`
#       de `src/config.php`; `TESTENV_CONTAINER`, `TESTENV_HOST`, `TEST_WEB_URL`,
#       `TESTENV_TRAEFIK_ROUTER` y los nombres de servicio salen del compose.
#       **No se guardan: se derivan.** Guardarlos sería una segunda verdad sobre
#       el mismo dato, y las segundas verdades divergen.
#   (C) CONFIGURACIÓN DEL PRODUCTO — lo de este fichero.
#
# Y de ahí sale lo que hace que esto merezca la pena: `.fs-test-env.env` deja de
# estar versionado en el repo del cliente y pasa a **generarse**, igual que
# `src/config.php` en `Mesa/FS`. Es la norma de la casa: *cualquier fichero que
# cambie por entorno y siga versionado tiene un defecto latente*.
#
# ## Claves (todas opcionales: lo que falte cae en el valor por defecto)
#
#   descripcion       texto libre, solo para la salida
#   core_repo         repositorio del core de FacturaScripts a clonar
#   core_branch       rama o TAG del core; vacío = la versión instalada
#   enable_list       plugins del warm-up; vacío = todos los enlazados
#   fs_lang           FS_LANG
#   fs_timezone       FS_TIMEZONE
#   test_web_title    título del runner web
#   testenv_image     imagen del contenedor de test
#   testenv_network   red del compose
#   container_engine  podman | docker
# =============================================================================

[mesa-fs]
descripcion      = Autobuses Mesa — ANCLA del proyecto: de esta entrada derivan sus copias la configuración de producto. El checkout principal NO monta entorno de test; el desarrollo va en worktrees
core_repo        = https://github.com/NeoRazorX/facturascripts.git
core_branch      =
enable_list      =
fs_lang          = es_ES
fs_timezone      = Atlantic/Canary
test_web_title   = Tests de plugins · Mesa FS
testenv_image    = ghcr.io/asermar/php_devel:8.4
testenv_network  = asermar.com
container_engine = podman

[lcp-fs]
descripcion      = Propkey (Lcp) — ANCLA del proyecto (migración desde la app VB6): de esta entrada derivan sus copias la configuración de producto. El checkout principal NO monta entorno de test; el desarrollo va en worktrees
core_repo        = https://github.com/NeoRazorX/facturascripts.git
core_branch      =
enable_list      =
fs_lang          = es_ES
fs_timezone      = Atlantic/Canary
test_web_title   = Tests de plugins · Propkey
testenv_image    = ghcr.io/asermar/php_devel:8.4
testenv_network  = asermar.com
container_engine = podman
